<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus 2.0</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d7377'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' font-weight='bold' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=39">
</head>
<body>
<div id="login" class="hidden">
  <form id="loginForm" class="login-box" autocomplete="on">
    <div class="brand"><span class="logo-mark">N</span>Nexus <b>2.0</b></div>
    <div class="login-sub">Sign in to your workspace</div>
    <label>Email<input name="email" type="email" required autofocus></label>
    <label><span id="pinLabel">PIN</span><input name="pin" type="password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <div id="loginMsg" class="muted small"></div>
    <div class="muted small" id="buildTagLogin"></div>
  </form>
</div>

<div id="app" class="hidden">
  <aside id="nav"></aside>
  <div class="main-wrap">
    <header id="top">
      <input id="gsearch" placeholder="Search order no / customer  ( / )" autocomplete="off">
      <span class="grow"></span>
      <span id="syncState" class="muted small"></span>
      <span id="buildTag" class="muted small"></span>
      <span id="who" class="small"></span>
      <button class="btn ghost" data-act="logout">Sign out</button>
    </header>
    <div id="flash" class="hidden"></div>
    <main id="main"></main>
  </div>
</div>

<script>window.NX_BUILD = 'build 39';</script>
<script src="config.js?v=39"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="engine.js?v=39"></script>
<script src="core.js?v=39"></script>
<script src="seed.js?v=39"></script>
<script src="ops.js?v=39"></script>
<script src="fms.js?v=39"></script>
<script src="modules.js?v=39"></script>
<script src="items.js?v=39"></script>
<script src="admin.js?v=39"></script>
<script>
document.getElementById('buildTag').textContent = window.NX_BUILD;
document.getElementById('buildTagLogin').textContent = window.NX_BUILD;
</script>
</body>
</html>
