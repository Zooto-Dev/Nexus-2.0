<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus 2.0</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css?v=103">
</head>
<body>
<div id="login" class="hidden">
  <div class="lg-brand">
    <div class="lg-brand-in">
      <img class="lg-logo" src="nexus-logo.png?v=103" alt="Nexus 2.0">
      <div class="lg-co">Zooto Fashion Pvt Ltd</div>
    </div>
  </div>
  <div class="lg-side">
    <form id="loginForm" class="lg-card" autocomplete="on">
      <div class="lg-h">Sign in</div>
      <label class="lg-f"><span>Email</span>
        <div class="lg-in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><input name="email" type="email" autocomplete="username" required autofocus></div></label>
      <label class="lg-f"><span id="pinLabel">PIN</span>
        <div class="lg-in"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><input name="pin" type="password" autocomplete="current-password" required><button type="button" class="lg-eye" id="lgEye" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button></div></label>
      <label class="lg-rem"><input type="checkbox" id="lgRem" checked> Remember my email</label>
      <button class="lg-btn" type="submit" id="lgGo"><span>Sign in</span></button>
      <div id="loginMsg" class="lg-msg"></div>
      <div class="lg-foot" id="buildTagLogin"></div>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="nav"></aside>
  <div class="main-wrap">
    <header id="top">
      <input id="gsearch" placeholder="Search order no / customer  ( / )" autocomplete="off">
      <span class="grow"></span>
      <span id="syncState" class="muted small"></span>
      <span id="buildTag" class="muted small"></span>
      <span id="who" class="small"></span>
      <button class="btn ghost" data-act="logout">Sign out</button>
    </header>
    <div id="flash" class="hidden"></div>
    <main id="main"></main>
  </div>
</div>

<script>window.NX_BUILD = 'build 103';</script>
<script src="config.js?v=103"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="engine.js?v=103"></script>
<script src="core.js?v=103"></script>
<script src="seed.js?v=103"></script>
<script src="ops.js?v=103"></script>
<script src="sample.js?v=103"></script>
<script src="fms.js?v=103"></script>
<script src="modules.js?v=103"></script>
<script src="checklist.js?v=103"></script>
<script src="colours.js?v=103"></script>
<script src="items.js?v=103"></script>
<script src="flow.js?v=103"></script>
<script src="track.js?v=103"></script>
<script src="tasks.js?v=103"></script>
<script src="wa.js?v=103"></script>
<script src="admin.js?v=103"></script>
<script>
document.getElementById('buildTag').textContent = window.NX_BUILD;
document.getElementById('buildTagLogin').textContent = window.NX_BUILD;
</script>
</body>
</html>
