<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login" class="hidden">
  <form id="loginForm" class="login-box" autocomplete="on">
    <div class="brand"><span class="logo-mark">N</span>Nexus <b>2.0</b></div>
    <div class="login-sub">Sign in to your workspace</div>
    <label>Email<input name="email" type="email" required autofocus></label>
    <label><span id="pinLabel">PIN</span><input name="pin" type="password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <div id="loginMsg" class="muted small"></div>
  </form>
</div>

<div id="app" class="hidden">
  <aside id="nav"></aside>
  <div class="main-wrap">
    <header id="top">
      <input id="gsearch" placeholder="Search order no / customer  ( / )" autocomplete="off">
      <span class="grow"></span>
      <span id="syncState" class="muted small"></span>
      <span id="who" class="small"></span>
      <button class="btn ghost" data-act="logout">Sign out</button>
    </header>
    <div id="flash" class="hidden"></div>
    <main id="main"></main>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="engine.js"></script>
<script src="core.js"></script>
<script src="seed.js"></script>
<script src="ops.js"></script>
<script src="fms.js"></script>
<script src="modules.js"></script>
<script src="admin.js"></script>
</body>
</html>
